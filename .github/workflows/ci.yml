name: CI

on:
  push:
    branches: [main, v2]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: node ${{ matrix.node }} / react ${{ matrix.react }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
        react: [18, 19]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      # peerDependencies allow ^18 || ^19; the lockfile pins 19, so the 18 leg swaps at runtime
      - if: matrix.react == 18
        run: npm install --no-save react@^18 react-dom@^18
      - if: matrix.react == 19
        run: npm run lint
      - if: matrix.react == 19
        run: npm run typecheck
      - run: npm test
      - if: matrix.react == 19
        run: npm run build

  generated:
    name: generated files and package contents
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prettier --check .
      # src/sound/clips.ts is committed but generated from sounds/*.ogg; a stale copy must fail
      - run: npm run build:clips
      - run: git diff --exit-code -- src/sound/clips.ts
      # prepack runs the build, so this is what `npm publish` would ship
      - run: npm pack --dry-run
